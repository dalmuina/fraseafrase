<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Ajustes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B3DF5}a:hover{color:#3A1FC2}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F5FF; font-family: Inter, system-ui, sans-serif; color: #14171F; display: flex; flex-direction: column">
  <header style="padding: 24px 20px 12px">
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.5px">Ajustes</h1>
  </header>

  <main style="flex: 1; padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 16px">
    <section aria-labelledby="lbl-nivel" style="background: #FFFFFF; border-radius: 24px; padding: 20px; box-shadow: 0 1px 2px rgba(20,23,31,0.06), 0 4px 16px rgba(20,23,31,0.05); display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h2 id="lbl-nivel" style="margin: 0; font-size: 17px; font-weight: 600">Nivel MCER (CEFR)</h2>
        <p style="margin: 0; font-size: 14px; color: #5A6070; line-height: 1.4">Elige tu nivel. Solo verás frases de este nivel o inferiores.</p>
      </div>
      <div role="group" aria-labelledby="lbl-nivel" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
          <button type="button" aria-pressed="false" style="height: 52px; border-radius: 14px; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; border: 2px solid #E4DFF5; background: #FFFFFF; color: #3A404D">A1</button>
          <button type="button" aria-pressed="false" style="height: 52px; border-radius: 14px; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; border: 2px solid #E4DFF5; background: #FFFFFF; color: #3A404D">A2</button>
          <button type="button" aria-pressed="true" style="height: 52px; border-radius: 14px; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; border: 2px solid #5B3DF5; background: #5B3DF5; color: #FFFFFF">B1</button>
          <button type="button" aria-pressed="false" style="height: 52px; border-radius: 14px; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; border: 2px solid #E4DFF5; background: #FFFFFF; color: #3A404D">B2</button>
          <button type="button" aria-pressed="false" style="height: 52px; border-radius: 14px; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; border: 2px solid #E4DFF5; background: #FFFFFF; color: #3A404D">C1</button>
      </div>
    </section>

    <section style="background: #FFFFFF; border-radius: 24px; padding: 20px; box-shadow: 0 1px 2px rgba(20,23,31,0.06), 0 4px 16px rgba(20,23,31,0.05); display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="tanda" style="font-size: 17px; font-weight: 600">Frases por tanda</label>
        <p style="margin: 0; font-size: 14px; color: #5A6070; line-height: 1.4">Mínimo 10 frases por sesión.</p>
      </div>
      <div style="display: flex; align-items: center; gap: 12px">
        <!-- Estado deshabilitado (en el mínimo). Habilitado: background #ECE7FF; color #3A1FC2 -->
        <button type="button" aria-label="Quitar 1 frase" disabled style="display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 14px; border: none; background: #EFECF8; color: #8A909C; cursor: not-allowed">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
        </button>
        <input id="tanda" type="number" min="10" step="1" value="10" readonly style="flex: 1; min-width: 0; height: 52px; box-sizing: border-box; border: 2px solid #E4DFF5; border-radius: 14px; text-align: center; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; color: #14171F; background: #F7F5FF">
        <button type="button" aria-label="Añadir 1 frase" style="display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 14px; border: none; background: #ECE7FF; color: #3A1FC2; cursor: pointer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
        </button>
      </div>
    </section>

    <div style="flex: 1"></div>

    <!-- Tras pulsar Guardar aparece: -->
    <p role="status" style="margin: 0; text-align: center; font-size: 14px; font-weight: 600; color: #1B6B44">Ajustes guardados</p>
    <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 16px; border: none; background: #5B3DF5; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
      Guardar
    </button>
  </main>

  <nav aria-label="Navegación principal" style="height: 80px; background: #FFFFFF; border-top: 1px solid #E4DFF5; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 0 8px">
    <a href="01-practicar-oculta.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5A6070; font-size: 12px; font-weight: 500">
      <span style="display: flex; align-items: center; justify-content: center; width: 64px; height: 32px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="14" height="14" rx="2"></rect><path d="M7 2h12a2 2 0 0 1 2 2v12"></path></svg>
      </span>
      Practicar
    </a>
    <a href="04-progreso.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5A6070; font-size: 12px; font-weight: 500">
      <span style="display: flex; align-items: center; justify-content: center; width: 64px; height: 32px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10"></path><path d="M10 20V4"></path><path d="M16 20v-7"></path><path d="M22 20H2"></path></svg>
      </span>
      Progreso
    </a>
    <a href="05-ajustes.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #14171F; font-size: 12px; font-weight: 700">
      <span style="display: flex; align-items: center; justify-content: center; width: 64px; height: 32px; border-radius: 999px; background: #ECE7FF; color: #5B3DF5">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10"></path><path d="M18 6h2"></path><circle cx="16" cy="6" r="2"></circle><path d="M4 12h4"></path><path d="M12 12h8"></path><circle cx="10" cy="12" r="2"></circle><path d="M4 18h10"></path><path d="M18 18h2"></path><circle cx="16" cy="18" r="2"></circle></svg>
      </span>
      Ajustes
    </a>
  </nav>
</div>
</body>
</html>
