<style>
body{margin:0}
a{color:#5B3DF5}a:hover{color:#3A1FC2}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F5FF; font-family: Inter, system-ui, sans-serif; color: #14171F; display: flex; flex-direction: column">
  <header style="padding: 24px 20px 12px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.5px">Practicar</h1>
      <span style="font-size: 15px; font-weight: 600; color: #3A1FC2; background: #ECE7FF; padding: 6px 12px; border-radius: 999px">10 de 10</span>
    </div>
    <div role="progressbar" aria-label="Progreso de la tanda" aria-valuemin="0" aria-valuemax="10" aria-valuenow="10" style="height: 8px; background: #E4DFF5; border-radius: 999px; overflow: hidden">
      <div style="width: 100%; height: 8px; background: #5B3DF5; border-radius: 999px"></div>
    </div>
  </header>

  <main style="flex: 1; padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 16px">
    <section style="flex: 1; background: #FFFFFF; border-radius: 24px; padding: 28px 24px; box-shadow: 0 1px 2px rgba(58,31,194,0.08), 0 8px 24px rgba(58,31,194,0.08); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center">
      <div style="position: relative; width: 128px; height: 128px; display: flex; align-items: center; justify-content: center">
        <svg width="128" height="128" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; left: 0; top: 0"><path d="M12 2l8.66 5v10L12 22l-8.66-5V7z" fill="#ECE7FF"></path></svg>
        <svg width="92" height="92" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; left: 18px; top: 18px"><path d="M12 2l8.66 5v10L12 22l-8.66-5V7z" fill="#5B3DF5"></path></svg>
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: relative"><path d="M20 6L9 17l-5-5"></path></svg>
        <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; right: -6px; top: 4px"><path d="M12 2l8.66 5v10L12 22l-8.66-5V7z" fill="#FF7A50"></path></svg>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.4px">¡Has completado la sesión!</h2>
        <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #5A5670">Has repasado las 10 frases de esta tanda.</p>
      </div>

      <div style="width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <div style="background: #E3F6EC; border-radius: 16px; padding: 12px 6px; display: flex; flex-direction: column; gap: 2px">
          <span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; color: #08693A">8</span>
          <span style="font-size: 12px; font-weight: 600; color: #08693A">Aciertos</span>
        </div>
        <div style="background: #FFECEE; border-radius: 16px; padding: 12px 6px; display: flex; flex-direction: column; gap: 2px">
          <span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; color: #B4232F">2</span>
          <span style="font-size: 12px; font-weight: 600; color: #B4232F">Fallos</span>
        </div>
        <div style="background: #FFF1EA; border-radius: 16px; padding: 12px 6px; display: flex; flex-direction: column; gap: 2px">
          <span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; color: #9A3412">3</span>
          <span style="font-size: 12px; font-weight: 600; color: #9A3412">Suben de rango</span>
        </div>
      </div>
    </section>

    <a href="01-practicar-oculta.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 16px; background: #5B3DF5; color: #FFFFFF; font-size: 17px; font-weight: 600; text-decoration: none; box-shadow: 0 6px 16px rgba(91,61,245,0.3)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8.3"></path><path d="M21 3v5.3h-5.3"></path></svg>
      Generar sesión nueva
    </a>
    <a href="04-progreso.html" style="display: flex; align-items: center; justify-content: center; height: 44px; font-size: 15px; font-weight: 600; text-decoration: none">Ver mi progreso</a>
  </main>

  <nav aria-label="Navegación principal" style="height: 80px; background: #FFFFFF; border-top: 1px solid #E4DFF5; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 0 8px">
    <a href="01-practicar-oculta.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #14171F; font-size: 12px; font-weight: 700">
      <span style="display: flex; align-items: center; justify-content: center; width: 64px; height: 32px; border-radius: 999px; background: #ECE7FF; color: #5B3DF5">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="14" height="14" rx="2"></rect><path d="M7 2h12a2 2 0 0 1 2 2v12"></path></svg>
      </span>
      Practicar
    </a>
    <a href="04-progreso.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5A5670; font-size: 12px; font-weight: 500">
      <span style="display: flex; align-items: center; justify-content: center; width: 64px; height: 32px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10"></path><path d="M10 20V4"></path><path d="M16 20v-7"></path><path d="M22 20H2"></path></svg>
      </span>
      Progreso
    </a>
    <a href="05-ajustes.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5A5670; font-size: 12px; font-weight: 500">
      <span style="display: flex; align-items: center; justify-content: center; width: 64px; height: 32px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10"></path><path d="M18 6h2"></path><circle cx="16" cy="6" r="2"></circle><path d="M4 12h4"></path><path d="M12 12h8"></path><circle cx="10" cy="12" r="2"></circle><path d="M4 18h10"></path><path d="M18 18h2"></path><circle cx="16" cy="18" r="2"></circle></svg>
